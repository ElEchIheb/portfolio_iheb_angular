<section class="section" id="jobs">
  <div class="container jobs"><div class="section-box">
    <h3 class="section-title"><span class="n-section-title">02.</span> {{ "Experience.Title" | translate }}</h3>
    <ol class="timeline">
      <li *ngFor="let job of 'Experience.Jobs' | translate; let i = index" class="timeline-item" [class.timeline-item--work]="job.Type === 'Experience'">
        <div class="timeline-marker" aria-hidden="true"></div>
        <article class="timeline-card" data-animate="fadeInUp" [attr.data-animate-delay]="i * 100">
          <div class="timeline-meta"><span>{{ job.Type }}</span><time>{{ job.Date }}</time></div>
          <h4>{{ job.Title }}</h4><p class="timeline-organization">{{ job.Organization }}</p>
          <ul><li *ngFor="let detail of job.Description">{{ detail }}</li></ul>
        </article>
      </li>
    </ol>
  </div></div>
</section>
